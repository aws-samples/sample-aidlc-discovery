name: Release v3

# Builds the Amazon Quick skill bundle and publishes it as the latest release.
# Triggered by v3.*.* tags only; earlier lines keep their own workflows on their branches.
on:
  push:
    tags:
      - 'v3.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches plugin.json and every skill
        run: |
          V="${{ steps.version.outputs.version }}"
          P=$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')
          [ "$P" = "$V" ] || { echo "::error::plugin.json is ${P}, tag is ${V}."; exit 1; }
          BAD=$(grep -L "^version: \"${V}\"$" skills/*/SKILL.md || true)
          [ -z "$BAD" ] || { echo "::error::Skills not at ${V}: ${BAD}"; exit 1; }

      - name: Verify CHANGELOG has an entry for this tag
        run: |
          V="${{ steps.version.outputs.version }}"
          grep -q "^## \[${V}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [${V}] section."; exit 1; }

      - name: Run tests
        run: python3 -m unittest discover tests -v

      - name: Build the skill bundle
        run: python3 scripts/build.py

      - name: Package the bundle
        run: |
          V="${{ steps.version.outputs.version }}"
          (cd dist && zip -qr "../aidlc-discovery-v${V}.zip" aidlc-discovery)

      - name: Extract release notes
        run: |
          V="${{ steps.version.outputs.version }}"
          awk "/^## \\[${V}\\]/{f=1;print;next}/^## \\[/{f=0}f" CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Release ${V}." > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: aidlc-discovery ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: aidlc-discovery-v*.zip
