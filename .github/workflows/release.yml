name: Release v3

# Builds the AWS Quick skill bundle and publishes it as the latest release.
# Two ways to start it:
#   - push a v3.*.* tag, or
#   - Actions, "Release v3", "Run workflow" on main, with a version such as 3.0.1:
#     the workflow checks it, then creates the tag and the release on main's latest commit.
# Earlier major lines keep their own workflows on their branches.
on:
  push:
    tags:
      - 'v3.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (for example 3.0.1)"
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            [ "${GITHUB_REF}" = "refs/heads/main" ] || { echo "::error::Run the release from main, not ${GITHUB_REF}."; exit 1; }
            V="${INPUT_VERSION#v}"
            TAG="v${V}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
              echo "::error::${TAG} already exists. Choose the next version."; exit 1
            fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
            V="${TAG#v}"
          fi
          echo "${V}" | grep -Eq '^3\.[0-9]+\.[0-9]+$' || { echo "::error::${V} is not a 3.x.y version."; exit 1; }
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches plugin.json and every skill
        run: |
          V="${{ steps.version.outputs.version }}"
          P=$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"])')
          [ "$P" = "$V" ] || { echo "::error::plugin.json is ${P}, tag is ${V}."; exit 1; }
          BAD=$(grep -L "^version: \"${V}\"$" skills/*/SKILL.md || true)
          [ -z "$BAD" ] || { echo "::error::Skills not at ${V}: ${BAD}"; exit 1; }

      - name: Verify CHANGELOG has an entry for this tag
        run: |
          V="${{ steps.version.outputs.version }}"
          grep -q "^## \[${V}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [${V}] section."; exit 1; }

      - name: Run tests
        run: python3 -m unittest discover tests -v

      - name: Build and package the skill bundle
        run: python3 scripts/build.py

      - name: Extract release notes
        run: |
          V="${{ steps.version.outputs.version }}"
          awk "/^## \\[${V}\\]/{f=1;print;next}/^## \\[/{f=0}f" CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Release ${V}." > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: aidlc-discovery ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: dist/aidlc-discovery-v*.zip
