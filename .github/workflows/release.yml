name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify CHANGELOG has an entry for this tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for version ${VERSION}."
            echo "Add a '## [${VERSION}] — YYYY-MM-DD' heading before tagging."
            exit 1
          fi

      - name: Build staging directory
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="staging/aidlc-discovery"
          mkdir -p "${STAGE}"

          # Copy only what belongs in the installed package: the runtime rules,
          # user-facing reference docs, and LICENSE. Repo-governance docs
          # (install.md, CONTRIBUTING.md, CODE_OF_CONDUCT.md) are intentionally
          # excluded — they are not needed inside .aidlc/aidlc-discovery/.
          cp -r aidlc-discovery-rules "${STAGE}/"
          cp README.md how-to-use.md CHANGELOG.md LICENSE "${STAGE}/"

          # Stamp the installed version so `cat .aidlc/aidlc-discovery/VERSION`
          # reports what the user has.
          printf '%s\n' "${VERSION}" > "${STAGE}/VERSION"

          # Record the source commit so users can audit exactly what they got.
          printf 'repo: %s\ntag: %s\ncommit: %s\nbuilt: %s\n' \
            "${GITHUB_REPOSITORY}" \
            "${{ steps.version.outputs.tag }}" \
            "${GITHUB_SHA}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "${STAGE}/.source"

      - name: Create release zip
        id: zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="aidlc-discovery-v${VERSION}.zip"
          (cd staging && zip -r "../${ZIP_NAME}" aidlc-discovery)
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the block between '## [VERSION]' and the next '## [' line.
          awk "/^## \\[${VERSION}\\]/{flag=1; print; next} /^## \\[/{flag=0} flag" \
            CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section found for ${VERSION}" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: aidlc-discovery ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: ${{ steps.zip.outputs.zip_name }}
          draft: false
          prerelease: false
