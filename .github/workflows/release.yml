name: Release v2

# Builds the bundles and publishes per-platform assets. Triggered by v2.*.* tags only,
# so it never collides with the v1 release workflow on main. Published as a PRE-RELEASE,
# which keeps `releases/latest` pointing at the stable v1 line.
on:
  push:
    tags:
      - 'v2.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify CHANGELOG has an entry for this tag
        run: |
          V="${{ steps.version.outputs.version }}"
          grep -q "^## \[${V}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [${V}] section."; exit 1; }

      - name: Build all targets
        run: node build.js

      - name: Package per-platform assets
        run: |
          V="${{ steps.version.outputs.version }}"
          (cd dist/kiro          && zip -qr "../../aidlc-discovery-kiro-v${V}.zip"   .kiro)
          (cd dist/claude        && zip -qr "../../aidlc-discovery-claude-v${V}.zip" .claude)
          (cd dist/amazon-quick/skills && zip -qr "../../../aidlc-discovery-quick-v${V}.zip" aidlc-discovery)

      - name: Extract release notes
        run: |
          V="${{ steps.version.outputs.version }}"
          awk "/^## \\[${V}\\]/{f=1;print;next}/^## \\[/{f=0}f" CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Pre-release ${V}." > release-notes.md

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: aidlc-discovery ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          prerelease: true
          files: |
            aidlc-discovery-kiro-v*.zip
            aidlc-discovery-claude-v*.zip
            aidlc-discovery-quick-v*.zip
